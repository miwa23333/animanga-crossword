  <body>
    <main class="container">
      <h1>動漫中文填字遊戲</h1>
      <p class="instructions">從下方的詞庫中找出答案，並填入對應的格子裡。</p>

      <div class="game-area">
        <div id="crossword-container">
          <div id="crossword-grid"></div>
        </div>
      </div>

      <div class="controls">
        <button id="check-btn">檢查答案</button>
        <button id="hint-btn">一字提示</button>
        <button id="reveal-btn">顯示答案</button>
        <button id="reset-btn">重新產生</button>
      </div>

      <div class="word-bank">
        <h3>可用詞庫</h3>
        <div id="word-bank-list"></div>
      </div>
    </main>

    <!-- Congratulations Modal -->

        <span class="close">&times;</span>
        <div class="modal-body">

          <button id="modal-ok-btn" class="modal-btn">確定</button>

      <p style="margin: 0 0 0.5rem;">
        這是 <a href="https://www.miwa23333.xyz/">miwa23333</a> 做的中文填字遊戲，詞庫是近年動畫作品的台灣中文譯名。看格子的位置與長度，從下方詞庫找出對應的作品填進去；橫向與直向的詞在交叉格共用同一個字。點格子即可輸入，同一個詞可以連續打字。「檢查答案」會標出填錯的格子，「一字提示」隨機填好一格，「顯示答案」直接填完，「重新產生」則用同一份詞庫排出全新的盤面。
